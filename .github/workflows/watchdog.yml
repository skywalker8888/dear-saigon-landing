name: Dear Saigon Watchdog
# Runs daily on GitHub's servers (free, public repo) — no need for your computer to be on.
# Checks: website up? · custom domain live yet? · still using the interim Google order link?
# Opens/updates a GitHub Issue when something needs your attention.

on:
  schedule:
    - cron: '17 13 * * *'   # ~9:17am Eastern daily (UTC)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE="https://skywalker8888.github.io/dear-saigon-landing/"
          DOMAIN="dearsaigonburlington.com"
          alerts=""
          note() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "## Dear Saigon watchdog — $(date -u)" >> "$GITHUB_STEP_SUMMARY"

          # 1) Website up?
          code=$(curl -s -o /tmp/p.html -w "%{http_code}" -L "$SITE" || echo 000)
          if [ "$code" = "200" ] && grep -q "DEAR SAIGON" /tmp/p.html; then
            note "✅ Website up (HTTP $code)"
          else
            note "🔴 Website DOWN or broken (HTTP $code)"; alerts="${alerts}- 🔴 Website is down or not rendering (HTTP $code).\n"
          fi

          # 2) Custom domain live yet?
          if python3 -c "import socket,sys; socket.gethostbyname('$DOMAIN')" 2>/dev/null; then
            note "✅ Domain $DOMAIN resolves — time to set it as the GitHub Pages custom domain."
            alerts="${alerts}- ✅ $DOMAIN now resolves — add it under repo Settings → Pages → Custom domain.\n"
          else
            note "⏳ $DOMAIN not resolving yet (DNS A-records not added)."
          fi

          # 3) Visit-only: flag accidental checkout / third-party order links.
          menu_code=$(curl -s -o /tmp/menu.html -w "%{http_code}" -L "${SITE}menu.html" || echo 000)
          if [ "$menu_code" != "200" ]; then
            note "🔴 menu.html not reachable (HTTP $menu_code)"
            alerts="${alerts}- 🔴 Native menu page is down or missing (HTTP $menu_code).\n"
          fi
          if grep -Eiq 'stripe|clover\.com|doordash|ubereats|skipthedishes|order online|checkout|add to cart' /tmp/p.html /tmp/menu.html; then
            note "🔴 Transactional order language or third-party order link detected on a visit-only page."
            alerts="${alerts}- 🔴 Visit-only page contains checkout/order language. Confirm before publishing.\n"
          else
            note "✅ No checkout / third-party order links detected (visit-only)."
          fi
          if grep -q "menu.html" /tmp/p.html; then
            note "✅ Native menu link present."
          else
            note "🔴 Homepage does not link to menu.html."
            alerts="${alerts}- 🔴 Homepage does not link to menu.html.\n"
          fi

          # Raise an issue only when there's something actionable
          if [ -n "$alerts" ]; then
            title="Dear Saigon watchdog: action needed"
            body=$(printf "Automated check on %s\n\n%b\nSite: %s" "$(date -u)" "$alerts" "$SITE")
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" || true
            fi
          fi
