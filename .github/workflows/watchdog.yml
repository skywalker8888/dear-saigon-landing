name: Dear Saigon Visit-only Watchdog
# Runs daily on GitHub's servers (free, public repo) — no need for your computer to be on.
# Checks: website up? · custom-domain DNS observation · visit-only safety wording intact?
# Opens/updates a GitHub Issue when something needs your attention.

on:
  schedule:
    - cron: '17 13 * * *'   # ~9:17am Eastern daily (UTC)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE="https://skywalker8888.github.io/dear-saigon-landing/"
          DOMAIN="dearsaigonburlington.com"
          alerts=""
          note() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "## Dear Saigon watchdog — $(date -u)" >> "$GITHUB_STEP_SUMMARY"

          # 1) Website up?
          code=$(curl -s -o /tmp/p.html -w "%{http_code}" -L "$SITE" || echo 000)
          if [ "$code" = "200" ] && grep -q "DEAR SAIGON" /tmp/p.html; then
            note "✅ Website up (HTTP $code)"
          else
            note "🔴 Website DOWN or broken (HTTP $code)"; alerts="${alerts}- 🔴 Website is down or not rendering (HTTP $code).\n"
          fi

          # 2) Observe custom-domain DNS without authorizing a domain change.
          if python3 -c "import socket,sys; socket.gethostbyname('$DOMAIN')" 2>/dev/null; then
            note "ℹ️ Domain $DOMAIN resolves. This check does not authorize a Pages or DNS change."
          else
            note "ℹ️ Domain $DOMAIN does not currently resolve. No action is authorized by this check."
          fi

          # 3) Keep the public page fail-closed. Google listing links are allowed
          # and must not be misclassified as order buttons.
          if grep -Eqi "Order Online|Checkout|Pay Now|ready in ~20 min|no app fees" /tmp/p.html; then
            note "🔴 Transactional or unsupported wording detected."
            alerts="${alerts}- 🔴 Visit-only safety wording is missing or a transactional claim is present.\n"
          elif grep -q "Online ordering is not enabled on this page." /tmp/p.html; then
            note "✅ Visit-only safety wording present."
          else
            note "🔴 Visit-only safety statement is missing."
            alerts="${alerts}- 🔴 Visit-only safety statement is missing.\n"
          fi

          # 4) Block known third-party instrumentation from silently returning.
          if grep -Eqi "posthog|google-analytics|assets.emergent.sh|session.?record" /tmp/p.html; then
            note "🔴 Third-party analytics or preview instrumentation detected."
            alerts="${alerts}- 🔴 Third-party analytics or preview instrumentation detected.\n"
          else
            note "✅ No blocked analytics or preview instrumentation detected."
          fi

          # Raise an issue only when there's something actionable
          if [ -n "$alerts" ]; then
            title="Dear Saigon watchdog: action needed"
            body=$(printf "Automated check on %s\n\n%b\nSite: %s" "$(date -u)" "$alerts" "$SITE")
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" || true
            fi
          fi
